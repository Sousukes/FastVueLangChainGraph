[project]
name = "fastapi-vue3-llm-course"
version = "0.1.0"
description = "0 基础 FastAPI + Vue3 全栈 LLM 实战教程后端代码库"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    # ⚠️ 这里曾声明 sse-starlette，阶段 18B 删掉了：全项目零引用。
    #    本项目的 SSE 一律用 fastapi.responses.StreamingResponse + 自建帧格式，
    #    不走 sse-starlette 的 EventSourceResponse（那会把帧格式交给它的协议）。
    #    别看着"做 SSE 就该装它"又加回来 —— 先 grep 一下确认真的在用。
    #
    # tzdata 不在上面，但**不能删**：tools.py 里的 ZoneInfo 在 Windows 上需要它
    # （zoneinfo 在 Windows 不带 tz 数据库）。它零 import 属正常，别按"看着没 import"就删。
    "tzdata>=2024.1",
    "chromadb>=0.5",
    # 阶段 07 起：本地嵌入。FastEmbed 走 ONNX，不依赖 torch，体积小、中文可用。
    "fastembed>=0.4,<1",
    # 阶段 08 起：中文分词，给 BM25 关键词检索用（中文没有空格，必须先分词）。
    "jieba>=0.42",
    # 阶段 18 起：把虚拟屏幕渲染成真实 PNG（Computer Use 的"被操作的那台电脑"）。
    # 此前 Pillow 只是被 chromadb 间接带进来，我们从这一阶段起**直接依赖**它，故显式声明。
    "pillow>=10",
]

[tool.uv]
package = false
