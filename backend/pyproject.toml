[project]
name = "fastapi-vue3-llm-course"
version = "0.1.0"
description = "0 基础 FastAPI + Vue3 全栈 LLM 实战教程后端代码库"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "sse-starlette>=2.1",
    "tzdata>=2024.1",
    "chromadb>=0.5",
    # 阶段 07 起：本地嵌入。FastEmbed 走 ONNX，不依赖 torch，体积小、中文可用。
    "fastembed>=0.4,<1",
    # 阶段 08 起：中文分词，给 BM25 关键词检索用（中文没有空格，必须先分词）。
    "jieba>=0.42",
]

[tool.uv]
package = false
